[tools]
python = "3.10"
uv = "latest"
"pypi:ruff" = "latest"
node = "24"
"npm:pyright" = "latest"

[settings]
python.uv_venv_auto = "source"

[env]
_.python.venv = { path = ".venv", create = false }

[tasks.install]
description = "Install or synchronize Python dependencies"
run = "uv venv .venv --allow-existing"

[tasks.lint]
description = "Run Ruff lint checks"
run = "ruff check ."

[tasks.format]
description = "Format Python code with Ruff"
run = "ruff format ."

[tasks.typecheck]
description = "Run Pyright type checking"
run = "pyright"

[tasks.test]
description = "Run project tests"
run = "python -m pytest"

[tasks.check]
description = "Run lint, type checking, and tests"
depends = ["lint", "typecheck", "test"]

[bootstrap.packages]
"apt:tmux" = "latest"

[tasks.opencode]
description = "Launch OpenCode in a project-specific tmux session"
run = "if [ -n \"${TMUX:-}\" ]; then\n  exec opencode\nfi\nsession=\"opencode-${MISE_PROJECT_ROOT##*/}\"\nexec tmux new-session -A -s \"$session\" opencode"
interactive = true
